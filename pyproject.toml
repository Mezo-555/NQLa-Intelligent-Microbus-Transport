[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nqla"
version = "0.1.0"
description = "NQLa Intelligent Microbus Transportation Platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_services*", "backend*"]